# Copy to config/secrets.yaml and chmod 600 (bootstrap scripts do this automatically).
# Never commit real credentials.

mqtt:
  password: ""

providers:
  codex:
    # subscription: OAuth from ~/.codex/auth.json or paste below
    access_token: ""
    refresh_token: ""
    account_id: ""
    # api mode: Organization Admin key (sk-admin-...) — https://platform.openai.com/settings/organization/admin-keys
    api_key: ""
  claude:
    # cookie mode (claude.ai subscription): DevTools → Cookies → sessionKey + lastActiveOrg
    session_token: ""
    org_id: ""
    cf_clearance: ""
    device_id: ""
    # oauth mode (Claude Code): ~/.claude/.credentials.json or paste below
    access_token: ""
    refresh_token: ""
  cursor:
    # personal: WorkosCursorSessionToken from cursor.com/dashboard/usage cookies
    session_token: ""
    # personal JWT fallback: Cursor state.vscdb or paste below
    access_token: ""
    refresh_token: ""
    # enterprise: Admin API key from Cursor team settings
    admin_api_key: ""
