name: ModelDeck (Nightly)
version: "0.0.8-nightly.20260701.1"
slug: modeldeck-nightly
description: Nightly ModelDeck bridge for Home Assistant (Codex, Claude, Cursor)
url: https://github.com/automationnexus/ModelDeck
stage: experimental
arch:
- aarch64
- amd64
startup: application
boot: auto
init: false
map:
- addon_config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: ModelDeck
options:
  mqtt:
    server: mqtt://core-mosquitto:1883
    username: ''
    password: ''
    topic_prefix: modeldeck_nightly
    discovery_prefix: homeassistant
  service:
    poll_interval_seconds: 300
    retain_state: true
    log_level: INFO
    persist_refreshed_tokens: true
    reset_secrets: false
schema:
  mqtt:
    server: url
    username: str?
    password: password?
    topic_prefix: str
    discovery_prefix: str
  service:
    poll_interval_seconds: int(60,)
    retain_state: bool
    log_level: list(DEBUG|INFO|WARNING|ERROR)
    persist_refreshed_tokens: bool
    reset_secrets: bool
build:
  dockerfile: Dockerfile
