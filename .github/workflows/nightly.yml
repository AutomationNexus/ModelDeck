name: Nightly Build

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Build even if no new commits since last nightly"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: automationnexus/modeldeck
  NIGHTLY_PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes on dev
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - name: Compare dev HEAD to nightly tag
        id: check
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          NIGHTLY_SHA=$(git rev-parse "nightly" 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "push" ]; then
            HAS_CHANGES=true
          elif [ "${{ inputs.force_run }}" = "true" ]; then
            HAS_CHANGES=true
          elif [ -z "$NIGHTLY_SHA" ] || [ "$TARGET_SHA" != "$NIGHTLY_SHA" ]; then
            HAS_CHANGES=true
          else
            HAS_CHANGES=false
          fi
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev,service]" -q
      - run: .venv/bin/python -m ruff check src tests tools

  test-standards:
    name: Test Standards
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python tests/check_test_standards.py

  test:
    name: Python Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev,service]" -q
      - run: >-
          .venv/bin/python -m pytest
          -m "not integration"
          -p no:cacheprovider
          --cov=src/modeldeck
          --cov-report=term-missing:skip-covered
          --cov-fail-under=97
      - run: .venv/bin/python -m modeldeck config validate --config templates/modeldeck.example.yaml

  move-tag:
    name: Move nightly Tag
    needs: [detect-changes, lint, test-standards, test]
    if: |
      always() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.lint.result == 'success' &&
      needs.test-standards.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Force-update nightly tag
        run: |
          TARGET="${{ needs.detect-changes.outputs.target_sha }}"
          git tag -f nightly "$TARGET"
          git push origin nightly --force

  build-and-push:
    name: Build & Push Docker Image
    needs: [detect-changes, move-tag]
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.move-tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.NIGHTLY_PLATFORMS }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          labels: |
            org.opencontainers.image.title=ModelDeck
            org.opencontainers.image.description=Nightly build from dev branch
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.detect-changes.outputs.target_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-scan:
    name: Container Scan (Trivy)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "0"

  sync-haos-nightly:
    name: Sync HAOS nightly add-on
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}

      - name: Resolve parent version for HAOS dispatch
        id: parent
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch ModelDeck-HAOS nightly sync
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT }}
        run: |
          gh api \
            --method POST \
            repos/automationnexus/ModelDeck-HAOS/dispatches \
            -f event_type=modeldeck-nightly-published \
            -f "client_payload[sha]=${{ needs.detect-changes.outputs.target_sha }}" \
            -f "client_payload[version]=${{ steps.parent.outputs.version }}"
