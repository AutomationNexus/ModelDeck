name: Promote dev to main

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: Version bump to apply on promote
        type: choice
        options: [patch, minor, major]
        default: patch
  # Fires automatically when a modeldeck/ change lands on dev — most commonly the
  # sync-addon-stable PR (part of release.yml) syncing the stable pin after a release.
  # There is no version-bump job here: stable add-on version is always exactly the
  # parent release version (see tools/sync_haos_addon.py); an add-on-only content
  # change (no parent release) still auto-promotes so new installs get it immediately,
  # it just doesn't bump the version — existing installed users see it at the next
  # real release, bundled.
  push:
    branches: [dev]
    paths:
      - "modeldeck/**"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev to main
    uses: automationnexus/.github/.github/workflows/promote-dev-to-main.yml@v1
    with:
      runner-labels: '["ubuntu-latest"]'
      strip-dev-only-paths: true
      # main is the sole owner of the nightly-channel add-on pointer files (the nightly
      # publish pathway writes them directly to main); a plain dev->main merge would
      # otherwise regress them to dev's stale copy.
      exclude-paths: |
        modeldeck-nightly/config.yaml
        modeldeck-nightly/CHANGELOG.md
      # The push-triggered path above is an add-on-only auto-promote (see its comment) and
      # must never bump the app version -- only a manual workflow_dispatch (a real release)
      # gets a real bump-type value.
      bump-type: ${{ github.event_name == 'workflow_dispatch' && inputs.bump-type || 'none' }}
    secrets:
      ci-bot-app-id: ${{ secrets.CI_BOT_APP_ID }}
      ci-bot-app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
