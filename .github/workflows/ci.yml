on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: automationnexus/.github/.github/workflows/ci.yml@v1
    with:
      branch-model: main-dev
      runner-labels: '["ubuntu-latest"]'
      has-integration: true
      has-security: true
      pip-install-cmd: 'python -m venv .venv && .venv/bin/pip install -e ".[dev,service]" -q'
      test-cmd: '.venv/bin/python -m pytest -m "not integration" -p no:cacheprovider --cov=src/modeldeck --cov-report=term-missing:skip-covered --cov-fail-under=97 && .venv/bin/python -m modeldeck config validate --config templates/modeldeck.example.yaml'
      integration-test-cmd: '.venv/bin/python -m pytest -m integration -v --tb=short'
      lint-paths: src tests tools
    secrets:
      ci-bot-app-id: ${{ secrets.CI_BOT_APP_ID }}
      ci-bot-app-private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
