name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing git tag to rebuild (e.g. v0.2.0)"
        required: true
        type: string
      multi_arch:
        description: "Build linux/amd64 + linux/arm64"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker-release:
    uses: automationnexus/.github/.github/workflows/release-docker.yml@v1
    with:
      runner-labels: '["ubuntu-latest"]'
      image-name: automationnexus/modeldeck
      platforms: linux/amd64,linux/arm64
      tag_name: ${{ inputs.tag_name || '' }}
      has-validation: false   # validation done by CI on dev/main pushes
      python-version: "3.11"

  sync-haos-stable:
    name: Sync HAOS stable add-on pin
    needs: [docker-release]
    if: always() && needs.docker-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint CI-Bot token for HAOS sync
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ModelDeck
            ModelDeck-HAOS
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Clone ModelDeck-HAOS dev
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          git clone --branch dev --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/automationnexus/ModelDeck-HAOS.git" \
            haos-checkout
      - name: Check if sync is needed
        id: sync_check
        run: |
          pip install pyyaml -q
          TAG=$(gh api repos/automationnexus/ModelDeck/releases/latest --jq '.tag_name' 2>/dev/null || echo "v0.0.0")
          if python tools/sync_haos_addon.py haos-checkout "$TAG" --check-only; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply stable pin
        if: steps.sync_check.outputs.needed == 'true'
        run: |
          pip install pyyaml -q
          TAG=$(gh api repos/automationnexus/ModelDeck/releases/latest --jq '.tag_name' 2>/dev/null || echo "v0.0.0")
          python tools/sync_haos_addon.py haos-checkout "$TAG"
          cd haos-checkout && python tools/validate_ha_addon.py
      - name: Open PR on ModelDeck-HAOS dev
        id: cpr
        if: steps.sync_check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot-token.outputs.token }}
          path: haos-checkout
          commit-message: "chore(haos): sync add-on to ModelDeck ${{ needs.docker-release.outputs.tag_name }}"
          title: "chore(haos): sync add-on to ModelDeck ${{ needs.docker-release.outputs.tag_name }}"
          body: |
            Automated sync after ModelDeck release.
          branch: sync/modeldeck-${{ needs.docker-release.outputs.tag_name }}
          base: dev
          delete-branch: true
      - name: Auto-merge HAOS sync PR
        if: steps.sync_check.outputs.needed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          gh pr merge "${PR}" --repo "automationnexus/ModelDeck-HAOS" --merge --delete-branch
