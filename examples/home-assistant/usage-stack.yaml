# Single-provider usage stack (OpenAI Codex example)
# Copy and swap modeldeck_codex_* → modeldeck_claude_* or modeldeck_cursor_* for other providers
# See modeldeck-tab.yaml for all three providers, or overview-compact.yaml for a summary row

type: vertical-stack
cards:
  - type: gauge
    entity: sensor.modeldeck_codex_default_usage_percent
    name: Codex Usage
    min: 0
    max: 100
    needle: true
    severity:
      green: 0
      yellow: 70
      red: 90
  - type: entities
    title: OpenAI Codex
    entities:
      - entity: sensor.modeldeck_codex_default_usage_weekly_percent
        name: Weekly Usage
      - entity: sensor.modeldeck_codex_default_reset_at
        name: Reset At
      - entity: sensor.modeldeck_codex_default_plan
        name: Plan
      - entity: sensor.modeldeck_codex_default_status
        name: Collector Status
