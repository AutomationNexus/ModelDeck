# Compact ModelDeck block for the Overview tab
# Dashboard → Edit → Add card → Manual → paste this entire file
# Entity IDs: sensor.modeldeck_{provider}_{metric} — see docs/guides/sensors.md
# Optional: card-mod (HACS) for red auth_error styling on the status row below
#
# Gauges:
#   Codex / Claude — primary window (subscription % or 5h) + 7-day weekly %
#   Cursor — no weekly sensor; shows billing-cycle total + Auto pool (add API row in tab view)
#
# Status row (optional): collector health (ok / auth_error / …), not usage %. Remove the
# entities card at the bottom if you only want gauges.

type: vertical-stack
cards:
  - type: grid
    columns: 3
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: gauge
            entity: sensor.modeldeck_codex_default_usage_percent
            name: Codex
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: gauge
            entity: sensor.modeldeck_codex_default_usage_weekly_percent
            name: Codex Weekly
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
      - type: vertical-stack
        cards:
          - type: gauge
            entity: sensor.modeldeck_claude_default_usage_percent
            name: Claude 5h
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: gauge
            entity: sensor.modeldeck_claude_default_usage_weekly_percent
            name: Claude Weekly
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
      - type: vertical-stack
        cards:
          - type: gauge
            entity: sensor.modeldeck_cursor_default_usage_percent
            name: Cursor
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: gauge
            entity: sensor.modeldeck_cursor_default_usage_auto_percent
            name: Cursor Auto
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
  - type: entities
    title: ModelDeck Collector
    show_header_toggle: false
    card_mod:
      style: |
        ha-card $: |
          .entity-row:has(state-badge[data-state="auth_error"]) {
            --primary-text-color: #f44336;
          }
    entities:
      - entity: sensor.modeldeck_codex_default_status
        name: Codex
      - entity: sensor.modeldeck_claude_default_status
        name: Claude
      - entity: sensor.modeldeck_cursor_default_status
        name: Cursor
