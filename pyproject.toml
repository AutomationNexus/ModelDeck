[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeldeck"
version = "0.0.8"
description = "Dockerized AI usage and quota bridge for Home Assistant via MQTT."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ModelDeck contributors" }]
dependencies = [
  "PyYAML>=6.0.1",
  "pydantic>=2.0",
]

[project.optional-dependencies]
service = [
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "aiomqtt>=2.0",
  "fastapi>=0.111",
  "uvicorn>=0.29",
]
webui = [
  "fastapi>=0.111",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  # Pinned to the same version Home Assistant Supervisor/Core ship, so the
  # nightly-version regression tests in tests/tools/ exercise the real
  # comparator HA's add-on Update button relies on.
  "awesomeversion==25.8.0",
]

[project.scripts]
modeldeck = "modeldeck.cli.main:main"
modeldeck-service = "modeldeck.service.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modeldeck.webui" = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not integration'"
asyncio_mode = "auto"
markers = [
  "integration: tests requiring Mosquitto or external services",
  "playwright: browser end-to-end tests (run tests/e2e_frontend explicitly)",
]
norecursedirs = ["tests/e2e_frontend"]

[tool.coverage.run]
source = ["src/modeldeck"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 97
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"src/modeldeck/webui/app.py" = ["E501"]  # JS in HTML strings
